# Classic supervised forecasting dataset catalog.
#
# The preparation command materializes these keys below TIME_DATASET. Forecast
# terms, split lengths, and prediction horizons are intentionally absent until
# the supervised protocol is selected. This prevents inherited TIME runners
# from silently evaluating only three of the classic 96/192/336/720 horizons.

datasets:
  electricity/H: {}
  traffic/H: {}
  solar/H: {}
  weather/H: {}
  exchange_rate/D: {}
  ETTh1/H: {}
  ETTh2/H: {}
  ETTm1/15T: {}
  ETTm2/15T: {}
