# Classic supervised forecasting dataset catalog.
# Prediction lengths are measured in sampling steps.
# Chronological split: final ceil(N/5) sampling steps are test; preceding dates
# remain available for fitting and any future training-validation policy.
# N is the local prepared-panel length (after hourly aggregation where needed).
# val_length=0 reserves no separate validation block at this stage.
# Context length is experiment-owned. TIME evaluation stride equals horizon.

datasets:
